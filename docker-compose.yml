version: '3.8'

services:
  teletweet:
    build: .
    container_name: teletweet
    restart: unless-stopped
    volumes:
      - ./teletweet:/app/teletweet
      - ./.env:/app/.env
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - TZ=UTC
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('https://api.telegram.org/bot${BOT_TOKEN}/getMe')"]
      interval: 300s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
    driver: local
